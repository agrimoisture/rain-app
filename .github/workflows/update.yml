name: 更新雨量資料並發布到 GitHub Pages

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分鐘（GitHub 排程可能延遲幾分鐘）
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取中央氣象署雨量資料
        id: fetch-rain
        continue-on-error: true
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python fetch_rain.py
      - uses: actions/configure-pages@v5
        if: steps.fetch-rain.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch-rain.outcome == 'success'
        with:
          path: public
      - id: deploy
        if: steps.fetch-rain.outcome == 'success'
        uses: actions/deploy-pages@v4
